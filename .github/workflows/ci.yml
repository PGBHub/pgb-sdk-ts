name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Package contents look right
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          grep -q "dist/index.js" pack.txt
          grep -q "README.md" pack.txt
          ! grep -q "test-dist" pack.txt
